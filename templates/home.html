<!DOCTYPE html>
<html lang="en">
<head>
    {% load static %}
    <meta charset="UTF-8" name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <link rel="shortcut icon" href="https://img.icons8.com/color/50/000000/tent.png" type="image/x-icon">

    <style>
        body, html {
            height: 100%;
            -moz-osx-font-smoothing: grayscale;

        }

        .parallax {
            width: 100%;
            height: 100%;
            /* Create the parallax scrolling effect */
            background-attachment: fixed;
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;
        }

        .scrolltest {
        {#background-image: url("static/registration/Dscroll.png")#}{#background-image: url("{% static 'Dscroll.png'%}")#}

        }

        .intro {
            background-image: url("{% static 'registration/Dname2.png'%}")
        }

        .verse {
            background-image: url("{% static 'registration/Dverse2.png'%}")
        }

        .dates {
            background-image: url("static/registration/4k.jpg")
        }

        .more {
            background-image: url("static/registration/4k.jpg")
        }

        .register-pic {
            background-image: url("static/registration/register.jpg")
        }

        {# tablets #}
        @media (min-width: 500px) and (max-width: 786px) {
            .intro {
                background-image: url("static/registration/4kipad.jpg") !important;
            }

            .verse {
                background-image: url("static/registration/4kipad.jpg") !important;
            }

            .dates {
                background-image: url("static/registration/4kipad.jpg") !important;
            }

            .more {
                background-image: url("static/registration/4kipad.jpg") !important;
            }

            .register-pic {
                background-image: url("static/registration/.jpg") !important;
            }
        }

        {# phones #}
        @media (max-width: 499px) {
            .intro {
                background-image: url("static/registration/kside.jpg") !important;
            }

            .verse {
                background-image: url("static/registration/kside.jpg") !important;
            }

            .dates {
                background-image: url("static/registration/kside.jpg") !important;
            }

            .more {
                background-image: url("static/registration/kside.jpg") !important;
            }

            .parallax {

                background-attachment: scroll;
            }

        }

        .trasparent-bar {
            position: absolute;
            height: 47px;
            left: 0;
            top: 98%;
            width: 100%;
            text-align: center;
            background: white;
            opacity: .5;
        }

        .trasparent-bar-1 {
            position: absolute;
            height: 47px;
            left: 0;
            top: 198%;
            width: 100%;
            text-align: center;
            background: white;
            opacity: .5;
        }

        .trasparent-bar-2 {
            position: absolute;
            height: 47px;
            left: 0;
            top: 298%;
            width: 100%;
            text-align: center;
            background: white;
            opacity: .5;
        }

        .caption {
            position: absolute;
            left: 0;
            top: 87%;
        {#top: 13%;#} width: 100%;
            text-align: center;
            margin-bottom: 0px;
        }

        .scroll-caption {
            font-family: "pennaregular";
        {#font-weight: bold;#} position: absolute;
            height: 37px;
            left: 46.5%;
            top: 88%;
            width: 120px;
            text-align: center;
        }

        .no-margin {
            font-family: "pennaregular";
            margin-top: 0px;
            font-size: 36px;
        {#background: white;#}{#opacity: .5;#} padding-left: 10px;
            padding-right: 10px;
            color: white;

        }

        .test-no-margin {
            font-family: "pennaregular";
            margin-top: 0px;
            font-size: 36px;
            background: white;
            opacity: .5;
            padding-left: 10px;
            padding-right: 10px;
        }

        .text-box {
            background: white;
            opacity: .5;
        }

        .bar {
            height: 100px;
            background-color: lightslategray;
            font-size: 36px;
        }

        .reg-button {
            margin-top: 0px;
            font-size: 36px;
            position: absolute;
            height: 72px;
            top: 234%;
            width: 100%;
            opacity: .5;
                        background-color: lightslategray;

            background: white;
        }
        .info-button {
            margin-top: 0px;
            font-size: 36px;
            position: absolute;
            height: 72px;
            top: 265%;
            width: 100%;
            opacity: .5;
            background: white;

        }

        @font-face {
            font-family: 'pennaregular';
            src: url('static/registration/webfontkit-20190207-020242/penna.woff2') format('woff2'),
            url('static/registration/webfontkit-20190207-020242/penna.woff') format('woff');
            font-weight: normal;
            font-style: normal;

        }

    </style>
</head>
<body>

<div class="parallax intro"></div>
<div class="caption">
    <span class="no-margin">S C R O L L</span>
    <span class="no-margin">D O W N</span>
</div>
<div class="trasparent-bar"></div>

<div class="parallax verse"></div>
<div class="trasparent-bar-1"></div>

{#<div class="parallax dates"></div>#}
{#<div class="trasparent-bar trasparent-bar-2"></div>#}

<div class="parallax register-pic"></div>
<button class="reg-button" onclick="window.location.href='/registration'">REGISTER</button>
<button class="info-button" onclick="window.location.href='/info'">MORE INFO</button>

</body>
</html>
