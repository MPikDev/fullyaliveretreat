<!DOCTYPE html>
<html lang="en">
<head>
    {% load static %}
    <title>Fully Alive Retreat</title>
    <!-- css link -->
    <link rel="stylesheet" href="{% static 'registration/style.css' %}"/>

    <meta charset="UTF-8" name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <link rel="shortcut icon" href="https://img.icons8.com/color/50/000000/tent.png" type="image/x-icon">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
    <!-- Global site tag (gtag.js) - Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=UA-135068928-1"></script>
    <script>
        window.dataLayer = window.dataLayer || [];

        function gtag() {
            dataLayer.push(arguments);
        }

        gtag('js', new Date());

        gtag('config', 'UA-135068928-1');
    </script>
</head>
<body>
<button class="invis-button back-button" onclick="goBack()" type="button"></button>
<div class="picture nature-pic" style="position: absolute"></div>

<!-- Slideshow container -->
<div class="slideshow-container">

    <!-- Full-width images with number and caption text -->
    <div class="mySlides fade">
{#        <div class="numbertext">1 / 8</div>#}
        <img src="{% static "registration/Slide1.jpg" %}" style="width:100%">
        {#    <div class="text">Caption Text</div>#}
    </div>

    <div class="mySlides fade">
        <img src="{% static "registration/Slide2.jpg" %}" style="width:100%">
    </div>

    <div class="mySlides fade">
        <img src="{% static "registration/Slide3.jpg" %}" style="width:100%">
    </div>

    <div class="mySlides fade">
        <img src="{% static "registration/Slide4.jpg" %}" style="width:100%">
    </div>

    <div class="mySlides fade">
        <img src="{% static "registration/Slide5.jpg" %}" style="width:100%">
    </div>

    <div class="mySlides fade">
        <img src="{% static "registration/Slide6.jpg" %}" style="width:100%">
    </div>

    <div class="mySlides fade">
        <img src="{% static "registration/Slide7.jpg" %}" style="width:100%">
    </div>

    <div class="mySlides fade">
        <img src="{% static "registration/Slide8.jpg" %}" style="width:100%">
    </div>

    <!-- Next and previous buttons -->
    <a class="prev" onclick="plusSlides(-1)">&#10094;</a>
    <a class="next" onclick="plusSlides(1)">&#10095;</a>

    <br>

    <!-- The dots/circles -->
    <div style="text-align:center">
        <span class="dot" onclick="currentSlide(1)"></span>
        <span class="dot" onclick="currentSlide(2)"></span>
        <span class="dot" onclick="currentSlide(3)"></span>
        <span class="dot" onclick="currentSlide(4)"></span>
        <span class="dot" onclick="currentSlide(5)"></span>
        <span class="dot" onclick="currentSlide(6)"></span>
        <span class="dot" onclick="currentSlide(7)"></span>
        <span class="dot" onclick="currentSlide(8)"></span>
    </div>
</div>
{#<iframe width="100%" height="315" src="https://www.youtube.com/embed/ztPhKAuXx5I" frameborder="0" allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>#}

<script>
    var slideIndex = 1;
    showSlides(slideIndex);

    // Next/previous controls
    function plusSlides(n) {
        showSlides(slideIndex += n);
    }

    // Thumbnail image controls
    function currentSlide(n) {
        showSlides(slideIndex = n);
    }

    function showSlides(n) {
        var i;
        var slides = document.getElementsByClassName("mySlides");
        var dots = document.getElementsByClassName("dot");
        if (n > slides.length) {
            slideIndex = 1
        }
        if (n < 1) {
            slideIndex = slides.length
        }
        for (i = 0; i < slides.length; i++) {
            slides[i].style.display = "none";
        }
        for (i = 0; i < dots.length; i++) {
            dots[i].className = dots[i].className.replace(" active", "");
        }
        slides[slideIndex - 1].style.display = "block";
        dots[slideIndex - 1].className += " active";
    }
</script>
<script>
    function goBack() {
        window.history.back();
    }
</script>
</body>
</html>
