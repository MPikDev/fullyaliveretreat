name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  debug:
    runs-on: ubuntu-latest

    steps:
      - name: Check secret
        env:
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
        run: |
          python -c "import os; print('Exists:', os.getenv('DJANGO_SECRET_KEY') is not None)"
          python -c "print('Length:', len(__import__('os').getenv('DJANGO_SECRET_KEY') or ''))"
